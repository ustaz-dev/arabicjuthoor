<!DOCTYPE html>
<html lang="en" dir="ltr" data-lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Juthoor · Document viewer</title>
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://arabicjuthoor.com/" />

<!-- Default OG card (updated dynamically per-document by viewer JS) -->
<meta property="og:type" content="article" />
<meta property="og:site_name" content="Juthoor" />
<meta property="og:title" id="og-title" content="Juthoor · The Arabic Tongue" />
<meta property="og:description" id="og-desc" content="A document from the Juthoor research dashboard." />
<meta property="og:image" content="https://arabicjuthoor.com/og-image.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" id="tw-title" content="Juthoor · The Arabic Tongue" />
<meta name="twitter:image" content="https://arabicjuthoor.com/og-image.png" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<!-- Self-hosted fonts (no Google CDN). -->
<link rel="stylesheet" href="fonts.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<style>
:root {
  --bg: #fdfaf5; --bg-2: #f6f0e6; --bg-card: #ffffff;
  --text: #1a2236; --text-2: #4a5266; --text-3: #8a8e9c;
  --accent: #b8862f; --accent-2: #d4a73f; --accent-bg: #faf3df;
  --border: #e4ddd0;
  --font-en: 'Inter', system-ui, -apple-system, sans-serif;
  --font-ar: 'Amiri', 'Noto Naskh Arabic', serif;
  --font-ar-display: 'Cairo', 'Tajawal', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Monaco, monospace;
}
[data-theme="dark"] {
  --bg: #161821; --bg-2: #1f222e; --bg-card: #1f222e;
  --text: #ebe7dd; --text-2: #b3afa3; --text-3: #7a7770;
  --accent: #d4a73f; --accent-2: #e8c466; --accent-bg: #2a2517;
  --border: #2e3140;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; padding: 0;
  font-family: var(--font-en);
  background: var(--bg); color: var(--text);
  line-height: 1.7; font-size: 16px;
  -webkit-font-smoothing: antialiased;
  transition: background .25s ease, color .25s ease;
}

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(253, 250, 245, 0.92);
  -webkit-backdrop-filter: saturate(180%) blur(10px);
  backdrop-filter: saturate(180%) blur(10px);
  border-bottom: 1px solid var(--border);
}
[data-theme="dark"] .topbar { background: rgba(22, 24, 33, 0.92); }
.topbar-inner {
  max-width: 920px; margin: 0 auto; padding: 14px 28px;
  display: flex; align-items: center; gap: 18px;
}
.brand {
  font-weight: 700; color: var(--text); text-decoration: none;
  font-size: 16px; letter-spacing: -0.01em;
}
.brand .accent { color: var(--accent); }
.brand:hover { color: var(--accent); }
.crumb {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--text-3); padding: 4px 10px;
  background: var(--bg-2); border-radius: 6px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1; min-width: 0;
}
.actions { display: flex; gap: 8px; }
.btn-sm {
  background: var(--bg-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 12px; font-size: 13px; font-weight: 500;
  text-decoration: none; cursor: pointer; font-family: inherit;
  transition: all .12s ease;
}
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }

/* Content area */
main.doc {
  max-width: 820px; margin: 0 auto; padding: 50px 28px 80px;
}

/* Loading / error state */
.state {
  text-align: center; padding: 80px 20px;
  color: var(--text-3); font-size: 15px;
}
.state code { font-family: var(--font-mono); color: var(--text-2); }

/* Markdown content */
.doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 {
  font-family: var(--font-en);
  font-weight: 700; letter-spacing: -0.015em;
  line-height: 1.2; margin: 2.4em 0 0.5em;
}
/* Hero treatment for H1 — bigger, gradient accent, no border */
.doc h1 {
  font-size: clamp(34px, 4.5vw, 48px);
  margin-top: 0; margin-bottom: 0.4em;
  padding-bottom: 0; border-bottom: 0;
  letter-spacing: -0.025em; line-height: 1.1;
  background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: var(--text);
}
.doc h2 {
  font-size: 26px; padding-top: 8px;
  position: relative;
}
/* Section number-dot accent on H2 */
.doc h2::before {
  content: ""; display: inline-block;
  width: 6px; height: 6px; background: var(--accent);
  border-radius: 50%; margin-inline-end: 12px;
  vertical-align: middle; opacity: 0.7;
}
.doc h3 { font-size: 20px; color: var(--text); }
.doc h3::before {
  content: "▸"; color: var(--accent); margin-inline-end: 8px; font-size: 14px; opacity: 0.6;
}
.doc h4 { font-size: 17px; color: var(--text-2); }
.doc p { margin: 0 0 1.1em; color: var(--text); }
.doc strong { font-weight: 700; color: var(--text); }
.doc em { font-style: italic; }

/* Lead paragraph — first paragraph after H1 gets a slightly larger, softer treatment */
.doc h1 + p,
.doc p.lead {
  font-size: 19px; line-height: 1.65;
  color: var(--text-2);
  margin-bottom: 1.6em;
  padding-bottom: 1.4em;
  border-bottom: 1px solid var(--border);
}
html[lang="ar"] .doc h1 + p,
html[lang="ar"] .doc p.lead {
  font-size: 20px; line-height: 1.85;
}

/* Status callouts — paragraphs starting with status emojis get styled boxes */
.doc .callout-status {
  margin: 1.2em 0;
  padding: 14px 18px;
  border-radius: 8px;
  border-inline-start: 4px solid var(--accent);
  background: var(--accent-bg);
  display: flex; gap: 12px; align-items: flex-start;
}
.doc .callout-status .callout-emoji {
  font-size: 22px; line-height: 1; flex-shrink: 0; margin-top: 2px;
}
.doc .callout-status .callout-body { flex: 1; }
.doc .callout-status p { margin: 0; }
.doc .callout-status.green  { border-color: #2d7a3b; background: #e8f3ea; }
.doc .callout-status.red    { border-color: #a83232; background: #fae7e7; }
.doc .callout-status.yellow { border-color: #b8862f; background: #faf3df; }
.doc .callout-status.info   { border-color: #2255a4; background: #e3edf9; }
[data-theme="dark"] .doc .callout-status.green  { background: #18301c; }
[data-theme="dark"] .doc .callout-status.red    { background: #3a1a1a; }
[data-theme="dark"] .doc .callout-status.yellow { background: #2a2517; }
[data-theme="dark"] .doc .callout-status.info   { background: #1a2538; }

/* Auto-TOC — sticky on wide screens, inline on narrow */
.doc-toc {
  margin: 0 0 32px;
  padding: 14px 18px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
}
.doc-toc .toc-title {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-3); margin-bottom: 10px;
}
html[lang="ar"] .doc-toc .toc-title { font-family: var(--font-ar-display); }
.doc-toc ol { margin: 0; padding-inline-start: 22px; }
.doc-toc li { margin-bottom: 4px; line-height: 1.55; }
.doc-toc a { color: var(--text-2); text-decoration: none; border-bottom: 0; }
.doc-toc a:hover { color: var(--accent); }
.doc-toc .toc-h3 { padding-inline-start: 16px; font-size: 13px; color: var(--text-3); }

.doc a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .12s ease; }
.doc a:hover { border-bottom-color: var(--accent); }

.doc ul, .doc ol { margin: 0 0 1.1em 0; padding-left: 28px; }
.doc li { margin-bottom: 0.4em; }

.doc code {
  font-family: var(--font-mono);
  background: var(--bg-2); padding: 2px 6px;
  border-radius: 4px; font-size: 0.92em;
  border: 1px solid var(--border);
}
.doc pre {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px;
  overflow-x: auto; font-size: 13px; line-height: 1.55;
  margin: 0 0 1.1em;
}
.doc pre code { background: none; border: none; padding: 0; }

.doc blockquote {
  margin: 0 0 1.1em; padding: 12px 18px;
  border-left: 4px solid var(--accent);
  background: var(--accent-bg);
  border-radius: 0 6px 6px 0;
  color: var(--text);
}
.doc blockquote p:last-child { margin-bottom: 0; }

.doc table {
  width: 100%; border-collapse: collapse;
  background: var(--bg-card);
  border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; margin: 0 0 1.4em;
  font-size: 14px;
}
.doc th, .doc td {
  padding: 10px 14px; text-align: left;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.doc th { background: var(--bg-2); font-weight: 600; font-size: 13px; }
.doc tr:last-child td { border-bottom: none; }
.doc tr:hover td { background: var(--bg-2); }

.doc hr { border: none; border-top: 1px solid var(--border); margin: 2.4em 0; }

/* Arabic content: detect via direction inheritance */
.doc [dir="rtl"], .doc.has-arabic {
  font-family: var(--font-ar); line-height: 1.95;
}
.doc.has-arabic h1, .doc.has-arabic h2, .doc.has-arabic h3, .doc.has-arabic h4 {
  font-family: var(--font-ar-display);
}

/* Auto-detect Arabic paragraphs and apply RTL */
.doc p, .doc li, .doc td, .doc th, .doc h1, .doc h2, .doc h3, .doc h4 {
  unicode-bidi: plaintext;
}

/* Footer back-link */
.doc-foot {
  margin-top: 60px; padding-top: 24px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; color: var(--text-3);
  flex-wrap: wrap; gap: 12px;
}
.doc-foot a { color: var(--accent); text-decoration: none; }
.doc-foot a:hover { text-decoration: underline; }

/* Reading progress bar — sits on top edge, fills as you scroll */
.read-progress {
  position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 100;
  background: transparent; pointer-events: none;
}
.read-progress > div {
  height: 100%; width: 0%; background: var(--accent);
  transition: width .08s linear;
}

/* Meta bar (reading time + word count) above the document body */
.doc-meta {
  display: flex; gap: 16px; flex-wrap: wrap;
  font-size: 13px; color: var(--text-3);
  margin: 0 0 28px; padding: 10px 14px;
  background: var(--bg-2); border-radius: 6px;
  border-left: 3px solid var(--accent);
}
html[lang="ar"] .doc-meta { border-left: 0; border-right: 3px solid var(--accent); }
.doc-meta span { display: inline-flex; align-items: center; gap: 6px; }

/* Heading permalink — a small "#" that appears on hover of an h2/h3 */
.doc h2, .doc h3 { position: relative; }
.heading-anchor {
  position: absolute; left: -28px; top: 50%; transform: translateY(-50%);
  width: 24px; text-align: center; opacity: 0;
  color: var(--accent); text-decoration: none; font-weight: 700;
  font-size: 18px; transition: opacity .12s;
}
html[lang="ar"] .heading-anchor { left: auto; right: -28px; }
.doc h2:hover .heading-anchor,
.doc h3:hover .heading-anchor,
.heading-anchor:focus-visible { opacity: 1; }
.heading-anchor.copied::after {
  content: "✓ copied"; position: absolute; left: 100%; top: 50%;
  transform: translateY(-50%); margin-left: 8px;
  background: var(--accent); color: white; padding: 2px 8px; border-radius: 4px;
  font-size: 11px; white-space: nowrap;
}

/* Focus ring for keyboard users */
*:focus { outline: none; }
*:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px; border-radius: 4px;
}

/* Block printing — research is published online only */
@media print {
  body::before {
    content: "Juthoor — The Arabic Tongue. Online publication only. arabicjuthoor.com";
    display: block; padding: 80px 40px; font-family: serif; font-size: 14pt;
  }
  body > *:not(:first-child) { display: none !important; }
}
img, picture { -webkit-user-drag: none; user-drag: none; }
</style>
</head>
<body>

<nav class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">Juthoor<span class="accent">.</span></a>
    <span class="crumb" id="crumb">—</span>
    <div class="actions">
      <div class="lang-toggle" role="group" aria-label="Language" style="display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden;">
        <button id="lang-en" class="btn-lang" style="padding:6px 12px; background:var(--bg-2); border:0; cursor:pointer; font-family:inherit; font-size:13px; color:var(--text-3);">EN</button>
        <button id="lang-ar" class="btn-lang" style="padding:6px 12px; background:var(--bg-2); border:0; cursor:pointer; font-family:'Cairo',sans-serif; font-size:13px; color:var(--text-3); border-left:1px solid var(--border);">عربي</button>
      </div>
      <a id="raw-link" class="btn-sm" target="_blank" rel="noopener">View raw</a>
      <button class="btn-sm" id="theme-toggle" aria-label="Toggle theme">☾</button>
    </div>
  </div>
</nav>

<div class="read-progress" aria-hidden="true"><div id="read-bar"></div></div>

<main class="doc" id="doc">
  <div class="state" id="state">Loading…</div>
</main>

<script>
// ---------- Theme ----------
(function() {
  const btn = document.getElementById('theme-toggle');
  const stored = localStorage.getItem('juthoor-theme');
  if (stored === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  function refresh() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    btn.textContent = dark ? '☀' : '☾';
  }
  refresh();
  btn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    if (cur === 'dark') {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('juthoor-theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('juthoor-theme', 'dark');
    }
    refresh();
  });
})();

// ---------- Document loader ----------
const docEl = document.getElementById('doc');
const stateEl = document.getElementById('state');
const crumbEl = document.getElementById('crumb');
const rawLink = document.getElementById('raw-link');

function setState(html) { stateEl.innerHTML = html; }

function rewriteLinks(htmlString, basePath) {
  // Rewrite relative .md links to go through the viewer
  const wrap = document.createElement('div');
  wrap.innerHTML = htmlString;
  wrap.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (!href) return;
    if (href.startsWith('http://') || href.startsWith('https://') || href.startsWith('mailto:') || href.startsWith('#')) return;
    // Resolve relative to current file
    const url = new URL(href, new URL(basePath, window.location.href));
    const path = url.pathname.replace(/^\//, '');
    if (path.endsWith('.md')) {
      a.setAttribute('href', 'viewer.html?file=' + encodeURIComponent(path) + url.hash);
    } else if (path.endsWith('.html') || path.endsWith('.htm')) {
      a.setAttribute('href', path + url.hash);
    } else {
      // For directories and other paths, leave alone but normalize
      a.setAttribute('href', path + url.hash);
    }
  });
  return wrap.innerHTML;
}

function detectArabic(text) {
  // Arabic Unicode range; if > 25% of letters are Arabic, treat doc as Arabic-leaning
  const arabicChars = (text.match(/[؀-ۿ]/g) || []).length;
  const totalLetters = (text.match(/[\p{Letter}]/gu) || []).length;
  return totalLetters > 0 && (arabicChars / totalLetters) > 0.25;
}

// ---------- Language switch ----------
function getCurrentLang() {
  return localStorage.getItem('juthoor-lang') === 'ar' ? 'ar' : 'en';
}

function arVariantOf(file) {
  // If file already ends with -ar.md, return it as-is. Otherwise insert -ar before .md.
  if (file.endsWith('-ar.md')) return file;
  if (file.endsWith('.md')) return file.slice(0, -3) + '-ar.md';
  return file;
}

function enVariantOf(file) {
  // Strip -ar suffix if present.
  if (file.endsWith('-ar.md')) return file.slice(0, -6) + '.md';
  return file;
}

(function() {
  const enBtn = document.getElementById('lang-en');
  const arBtn = document.getElementById('lang-ar');
  function applyActive() {
    const lang = getCurrentLang();
    enBtn.style.background = (lang === 'en') ? 'var(--accent)' : 'var(--bg-2)';
    enBtn.style.color = (lang === 'en') ? '#fff' : 'var(--text-3)';
    arBtn.style.background = (lang === 'ar') ? 'var(--accent)' : 'var(--bg-2)';
    arBtn.style.color = (lang === 'ar') ? '#fff' : 'var(--text-3)';
  }
  function switchTo(lang) {
    localStorage.setItem('juthoor-lang', lang);
    applyActive();
    // Reload with the variant file in the URL
    const params = new URLSearchParams(window.location.search);
    const current = params.get('file');
    if (!current) return;
    const target = (lang === 'ar') ? arVariantOf(current) : enVariantOf(current);
    if (target === current) {
      // Same file, just rerender direction
      loadDocument();
    } else {
      params.set('file', target);
      window.location.search = '?' + params.toString();
    }
  }
  enBtn.addEventListener('click', () => switchTo('en'));
  arBtn.addEventListener('click', () => switchTo('ar'));
  applyActive();
})();

async function loadDocument() {
  const params = new URLSearchParams(window.location.search);
  let file = params.get('file');
  if (!file) {
    setState('No document specified. <br><br><a href="index.html">← Back to Juthoor dashboard</a>');
    return;
  }
  // Sanitize: only allow .md files within the site, no traversal
  if (file.includes('..') || !file.endsWith('.md')) {
    setState('Invalid document path.');
    return;
  }
  // If user preference is Arabic, prefer the -ar variant when available.
  const lang = getCurrentLang();
  if (lang === 'ar' && !file.endsWith('-ar.md')) {
    const arFile = arVariantOf(file);
    try {
      const head = await fetch(arFile, { method: 'HEAD' });
      if (head.ok) {
        // Update URL silently and continue with the AR file
        const newParams = new URLSearchParams(window.location.search);
        newParams.set('file', arFile);
        window.history.replaceState({}, '', window.location.pathname + '?' + newParams.toString());
        file = arFile;
      }
    } catch (_) { /* fall through to original */ }
  }
  crumbEl.textContent = file;
  rawLink.href = file;
  // Provisional title from filename — overwritten below once the H1 is parsed.
  document.title = file.split('/').pop().replace(/-ar\.md$|\.md$/, '') + ' · Juthoor';

  try {
    const resp = await fetch(file);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const md = await resp.text();
    // Pull the first H1 + first non-heading paragraph so the page has a real
    // title and the social-card preview shows something meaningful.
    const h1 = (md.match(/^# +(.+)$/m) || [])[1];
    if (h1) {
      const clean = h1.replace(/[`*_]/g, '').trim();
      document.title = clean + ' · Juthoor';
      const ogT = document.getElementById('og-title');
      const twT = document.getElementById('tw-title');
      if (ogT) ogT.setAttribute('content', clean + ' · Juthoor');
      if (twT) twT.setAttribute('content', clean + ' · Juthoor');
    }
    const firstPara = (md
      .replace(/^#.*$/gm, '')           // drop heading lines
      .replace(/^>.*$/gm, '')           // drop blockquotes
      .replace(/^---$/gm, '')           // drop separators
      .split(/\n\n+/)
      .map(s => s.trim())
      .find(s => s.length > 40)) || '';
    if (firstPara) {
      const desc = firstPara.replace(/\s+/g, ' ').slice(0, 200).replace(/[`*_]/g, '');
      const ogD = document.getElementById('og-desc');
      if (ogD) ogD.setAttribute('content', desc);
    }
    const isArabic = detectArabic(md);
    if (isArabic) {
      document.documentElement.setAttribute('dir', 'rtl');
      document.documentElement.setAttribute('lang', 'ar');
      docEl.classList.add('has-arabic');
    } else {
      document.documentElement.setAttribute('dir', 'ltr');
      document.documentElement.setAttribute('lang', 'en');
      docEl.classList.remove('has-arabic');
    }
    marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });
    const rawHtml = marked.parse(md);
    const cleaned = DOMPurify.sanitize(rawHtml, { ADD_ATTR: ['target', 'rel'] });
    const rewritten = rewriteLinks(cleaned, file);

    // Reading time: ~200 wpm for English, ~150 wpm for Arabic (denser script).
    const words = md.replace(/[#>*_`~\-]/g, ' ').split(/\s+/).filter(w => w.length > 1).length;
    const wpm = isArabic ? 150 : 200;
    const mins = Math.max(1, Math.round(words / wpm));
    const metaLabel = isArabic
      ? `<span>⏱ زَمنُ القِراءة المُتَوَقَّع: نَحوُ ${mins} دَقيقة</span><span>· ${words.toLocaleString('ar-EG')} كَلِمة</span>`
      : `<span>⏱ Estimated read: ~${mins} min</span><span>· ${words.toLocaleString('en-US')} words</span>`;
    const metaBar = `<div class="doc-meta" role="note">${metaLabel}</div>`;

    const backLabel = isArabic ? 'العودة إلى اللوحة' : 'Back to dashboard';
    docEl.innerHTML = metaBar + rewritten + '<div class="doc-foot"><a href="index.html">← ' + backLabel + '</a><span>' + file + '</span></div>';
    // Open external links in new tab
    docEl.querySelectorAll('a[href^="http"]').forEach(a => {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
    });

    // ── Modernization pass: lead paragraph, status callouts, auto-TOC ──
    enhanceDocument(docEl, isArabic);

    // Heading permalinks — click "#" to copy a deep link to that section.
    docEl.querySelectorAll('h2[id], h3[id]').forEach(h => {
      const a = document.createElement('a');
      a.className = 'heading-anchor';
      a.href = '#' + h.id;
      a.textContent = '#';
      a.setAttribute('aria-label', isArabic ? 'انسَخ رابطَ هذا القِسم' : 'Copy link to this section');
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const url = location.origin + location.pathname + location.search + '#' + h.id;
        navigator.clipboard.writeText(url).then(() => {
          a.classList.add('copied');
          setTimeout(() => a.classList.remove('copied'), 1400);
          history.replaceState(null, '', '#' + h.id);
        });
      });
      h.appendChild(a);
    });
  } catch (err) {
    setState('Could not load <code>' + file + '</code><br><small>' + err.message + '</small><br><br><a href="index.html">← Back to Juthoor dashboard</a>');
  }
}

// ---------- Modernization helpers ----------
function enhanceDocument(root, isArabic) {
  // 1) Lead paragraph: the first real <p> after H1 gets the .lead class
  const h1 = root.querySelector('h1');
  if (h1) {
    let n = h1.nextElementSibling;
    while (n && (n.tagName === 'BLOCKQUOTE' || n.tagName === 'HR' ||
                 (n.tagName === 'P' && n.textContent.trim().startsWith('**Date:**')))) {
      n = n.nextElementSibling;
    }
    if (n && n.tagName === 'P' && n.textContent.trim().length > 60) {
      n.classList.add('lead');
    }
  }

  // 2) Status callouts: paragraphs that LEAD with a status emoji become styled boxes
  const STATUS_MAP = {
    '🟢': 'green', '✅': 'green',
    '🔴': 'red',   '❌': 'red',
    '🟡': 'yellow', '⚠️': 'yellow', '⚠': 'yellow',
    '🎯': 'info',  '🔬': 'info', '📜': 'info', '🟦': 'info', '🟪': 'info', '📊': 'info',
  };
  root.querySelectorAll('p').forEach(p => {
    const txt = p.textContent.trim();
    if (!txt) return;
    let emoji = null, color = null;
    for (const k of Object.keys(STATUS_MAP)) {
      if (txt.startsWith(k)) { emoji = k; color = STATUS_MAP[k]; break; }
    }
    if (!emoji) return;
    const html = p.innerHTML.replace(emoji, '').trimStart();
    const wrap = document.createElement('div');
    wrap.className = 'callout-status ' + color;
    wrap.innerHTML = `<span class="callout-emoji">${emoji}</span><div class="callout-body"><p>${html}</p></div>`;
    p.replaceWith(wrap);
  });

  // 3) Auto-TOC: only when document has 4+ H2 sections
  const h2s = root.querySelectorAll('h2[id]');
  if (h2s.length >= 4) {
    const toc = document.createElement('nav');
    toc.className = 'doc-toc';
    const tocTitle = isArabic ? 'مَحاوِر هذه الصَّفحة' : 'On this page';
    let html = `<div class="toc-title">${tocTitle}</div><ol>`;
    h2s.forEach(h2 => {
      const text = h2.textContent.replace(/^#/, '').trim();
      html += `<li><a href="#${h2.id}">${text}</a></li>`;
    });
    html += '</ol>';
    toc.innerHTML = html;
    const insertAfter = root.querySelector('.doc-meta') || root.querySelector('h1');
    if (insertAfter) {
      let target = insertAfter;
      if (target.nextElementSibling && target.nextElementSibling.classList &&
          target.nextElementSibling.classList.contains('lead')) {
        target = target.nextElementSibling;
      }
      target.parentNode.insertBefore(toc, target.nextElementSibling);
    }
  }
}

loadDocument();

// Reading-progress bar: fills as the user scrolls through the doc.
(function () {
  const bar = document.getElementById('read-bar');
  if (!bar) return;
  let ticking = false;
  function update() {
    const h = document.documentElement;
    const scrolled = h.scrollTop || document.body.scrollTop;
    const height = (h.scrollHeight - h.clientHeight) || 1;
    bar.style.width = Math.min(100, (scrolled / height) * 100).toFixed(2) + '%';
    ticking = false;
  }
  window.addEventListener('scroll', () => {
    if (!ticking) { requestAnimationFrame(update); ticking = true; }
  }, { passive: true });
  window.addEventListener('resize', update, { passive: true });
})();
</script>
