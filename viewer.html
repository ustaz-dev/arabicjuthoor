<!DOCTYPE html>
<html lang="en" dir="ltr" data-lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Juthoor · Document viewer</title>
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://arabicjuthoor.com/" />

<!-- Default OG card (updated dynamically per-document by viewer JS) -->
<meta property="og:type" content="article" />
<meta property="og:site_name" content="Juthoor" />
<meta property="og:title" id="og-title" content="Juthoor · The Arabic Tongue" />
<meta property="og:description" id="og-desc" content="A document from the Juthoor research dashboard." />
<meta property="og:image" content="https://arabicjuthoor.com/og-image.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" id="tw-title" content="Juthoor · The Arabic Tongue" />
<meta name="twitter:image" content="https://arabicjuthoor.com/og-image.png" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<!-- Self-hosted fonts (no Google CDN). -->
<link rel="stylesheet" href="fonts.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<style>
:root {
  --bg: #fdfaf5; --bg-2: #f6f0e6; --bg-card: #ffffff;
  --text: #1a2236; --text-2: #4a5266; --text-3: #8a8e9c;
  --accent: #b8862f; --accent-2: #d4a73f; --accent-bg: #faf3df;
  --border: #e4ddd0;
  --font-en: 'Inter', system-ui, -apple-system, sans-serif;
  --font-ar: 'Amiri', 'Noto Naskh Arabic', serif;
  --font-ar-display: 'Cairo', 'Tajawal', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Monaco, monospace;
}
[data-theme="dark"] {
  --bg: #161821; --bg-2: #1f222e; --bg-card: #1f222e;
  --text: #ebe7dd; --text-2: #b3afa3; --text-3: #7a7770;
  --accent: #d4a73f; --accent-2: #e8c466; --accent-bg: #2a2517;
  --border: #2e3140;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; padding: 0;
  font-family: var(--font-en);
  background: var(--bg); color: var(--text);
  line-height: 1.7; font-size: 16px;
  -webkit-font-smoothing: antialiased;
  transition: background .25s ease, color .25s ease;
}

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(253, 250, 245, 0.92);
  -webkit-backdrop-filter: saturate(180%) blur(10px);
  backdrop-filter: saturate(180%) blur(10px);
  border-bottom: 1px solid var(--border);
}
[data-theme="dark"] .topbar { background: rgba(22, 24, 33, 0.92); }
.topbar-inner {
  max-width: 920px; margin: 0 auto; padding: 14px 28px;
  display: flex; align-items: center; gap: 18px;
}
.brand {
  font-weight: 700; color: var(--text); text-decoration: none;
  font-size: 16px; letter-spacing: -0.01em;
}
.brand .accent { color: var(--accent); }
.brand:hover { color: var(--accent); }
.crumb {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--text-3); padding: 4px 10px;
  background: var(--bg-2); border-radius: 6px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1; min-width: 0;
}
.actions { display: flex; gap: 8px; }
.btn-sm {
  background: var(--bg-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 12px; font-size: 13px; font-weight: 500;
  text-decoration: none; cursor: pointer; font-family: inherit;
  transition: all .12s ease;
}
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }

/* Content area */
main.doc {
  max-width: 820px; margin: 0 auto; padding: 50px 28px 80px;
}

/* Loading / error state */
.state {
  text-align: center; padding: 80px 20px;
  color: var(--text-3); font-size: 15px;
}
.state code { font-family: var(--font-mono); color: var(--text-2); }

/* Markdown content */
.doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 {
  font-family: var(--font-en);
  font-weight: 700; letter-spacing: -0.015em;
  line-height: 1.25; margin: 2.2em 0 0.6em;
}
.doc h1 { font-size: 36px; margin-top: 0; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.doc h2 { font-size: 26px; padding-top: 8px; }
.doc h3 { font-size: 20px; }
.doc h4 { font-size: 17px; }
.doc p { margin: 0 0 1.1em; color: var(--text); }
.doc strong { font-weight: 700; color: var(--text); }
.doc em { font-style: italic; }

.doc a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .12s ease; }
.doc a:hover { border-bottom-color: var(--accent); }

.doc ul, .doc ol { margin: 0 0 1.1em 0; padding-left: 28px; }
.doc li { margin-bottom: 0.4em; }

.doc code {
  font-family: var(--font-mono);
  background: var(--bg-2); padding: 2px 6px;
  border-radius: 4px; font-size: 0.92em;
  border: 1px solid var(--border);
}
.doc pre {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px;
  overflow-x: auto; font-size: 13px; line-height: 1.55;
  margin: 0 0 1.1em;
}
.doc pre code { background: none; border: none; padding: 0; }

.doc blockquote {
  margin: 0 0 1.1em; padding: 12px 18px;
  border-left: 4px solid var(--accent);
  background: var(--accent-bg);
  border-radius: 0 6px 6px 0;
  color: var(--text);
}
.doc blockquote p:last-child { margin-bottom: 0; }

.doc table {
  width: 100%; border-collapse: collapse;
  background: var(--bg-card);
  border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; margin: 0 0 1.4em;
  font-size: 14px;
}
.doc th, .doc td {
  padding: 10px 14px; text-align: left;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.doc th { background: var(--bg-2); font-weight: 600; font-size: 13px; }
.doc tr:last-child td { border-bottom: none; }
.doc tr:hover td { background: var(--bg-2); }

.doc hr { border: none; border-top: 1px solid var(--border); margin: 2.4em 0; }

/* Arabic content: detect via direction inheritance */
.doc [dir="rtl"], .doc.has-arabic {
  font-family: var(--font-ar); line-height: 1.95;
}
.doc.has-arabic h1, .doc.has-arabic h2, .doc.has-arabic h3, .doc.has-arabic h4 {
  font-family: var(--font-ar-display);
}

/* Auto-detect Arabic paragraphs and apply RTL */
.doc p, .doc li, .doc td, .doc th, .doc h1, .doc h2, .doc h3, .doc h4 {
  unicode-bidi: plaintext;
}

/* Footer back-link */
.doc-foot {
  margin-top: 60px; padding-top: 24px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; color: var(--text-3);
  flex-wrap: wrap; gap: 12px;
}
.doc-foot a { color: var(--accent); text-decoration: none; }
.doc-foot a:hover { text-decoration: underline; }
</style>
</head>
<body>

<nav class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">Juthoor<span class="accent">.</span></a>
    <span class="crumb" id="crumb">—</span>
    <div class="actions">
      <div class="lang-toggle" role="group" aria-label="Language" style="display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden;">
        <button id="lang-en" class="btn-lang" style="padding:6px 12px; background:var(--bg-2); border:0; cursor:pointer; font-family:inherit; font-size:13px; color:var(--text-3);">EN</button>
        <button id="lang-ar" class="btn-lang" style="padding:6px 12px; background:var(--bg-2); border:0; cursor:pointer; font-family:'Cairo',sans-serif; font-size:13px; color:var(--text-3); border-left:1px solid var(--border);">عربي</button>
      </div>
      <a id="raw-link" class="btn-sm" target="_blank" rel="noopener">View raw</a>
      <button class="btn-sm" id="theme-toggle" aria-label="Toggle theme">☾</button>
    </div>
  </div>
</nav>

<main class="doc" id="doc">
  <div class="state" id="state">Loading…</div>
</main>

<script>
// ---------- Theme ----------
(function() {
  const btn = document.getElementById('theme-toggle');
  const stored = localStorage.getItem('juthoor-theme');
  if (stored === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  function refresh() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    btn.textContent = dark ? '☀' : '☾';
  }
  refresh();
  btn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    if (cur === 'dark') {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('juthoor-theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('juthoor-theme', 'dark');
    }
    refresh();
  });
})();

// ---------- Document loader ----------
const docEl = document.getElementById('doc');
const stateEl = document.getElementById('state');
const crumbEl = document.getElementById('crumb');
const rawLink = document.getElementById('raw-link');

function setState(html) { stateEl.innerHTML = html; }

function rewriteLinks(htmlString, basePath) {
  // Rewrite relative .md links to go through the viewer
  const wrap = document.createElement('div');
  wrap.innerHTML = htmlString;
  wrap.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (!href) return;
    if (href.startsWith('http://') || href.startsWith('https://') || href.startsWith('mailto:') || href.startsWith('#')) return;
    // Resolve relative to current file
    const url = new URL(href, new URL(basePath, window.location.href));
    const path = url.pathname.replace(/^\//, '');
    if (path.endsWith('.md')) {
      a.setAttribute('href', 'viewer.html?file=' + encodeURIComponent(path) + url.hash);
    } else if (path.endsWith('.html') || path.endsWith('.htm')) {
      a.setAttribute('href', path + url.hash);
    } else {
      // For directories and other paths, leave alone but normalize
      a.setAttribute('href', path + url.hash);
    }
  });
  return wrap.innerHTML;
}

function detectArabic(text) {
  // Arabic Unicode range; if > 25% of letters are Arabic, treat doc as Arabic-leaning
  const arabicChars = (text.match(/[؀-ۿ]/g) || []).length;
  const totalLetters = (text.match(/[\p{Letter}]/gu) || []).length;
  return totalLetters > 0 && (arabicChars / totalLetters) > 0.25;
}

// ---------- Language switch ----------
function getCurrentLang() {
  return localStorage.getItem('juthoor-lang') === 'ar' ? 'ar' : 'en';
}

function arVariantOf(file) {
  // If file already ends with -ar.md, return it as-is. Otherwise insert -ar before .md.
  if (file.endsWith('-ar.md')) return file;
  if (file.endsWith('.md')) return file.slice(0, -3) + '-ar.md';
  return file;
}

function enVariantOf(file) {
  // Strip -ar suffix if present.
  if (file.endsWith('-ar.md')) return file.slice(0, -6) + '.md';
  return file;
}

(function() {
  const enBtn = document.getElementById('lang-en');
  const arBtn = document.getElementById('lang-ar');
  function applyActive() {
    const lang = getCurrentLang();
    enBtn.style.background = (lang === 'en') ? 'var(--accent)' : 'var(--bg-2)';
    enBtn.style.color = (lang === 'en') ? '#fff' : 'var(--text-3)';
    arBtn.style.background = (lang === 'ar') ? 'var(--accent)' : 'var(--bg-2)';
    arBtn.style.color = (lang === 'ar') ? '#fff' : 'var(--text-3)';
  }
  function switchTo(lang) {
    localStorage.setItem('juthoor-lang', lang);
    applyActive();
    // Reload with the variant file in the URL
    const params = new URLSearchParams(window.location.search);
    const current = params.get('file');
    if (!current) return;
    const target = (lang === 'ar') ? arVariantOf(current) : enVariantOf(current);
    if (target === current) {
      // Same file, just rerender direction
      loadDocument();
    } else {
      params.set('file', target);
      window.location.search = '?' + params.toString();
    }
  }
  enBtn.addEventListener('click', () => switchTo('en'));
  arBtn.addEventListener('click', () => switchTo('ar'));
  applyActive();
})();

async function loadDocument() {
  const params = new URLSearchParams(window.location.search);
  let file = params.get('file');
  if (!file) {
    setState('No document specified. <br><br><a href="index.html">← Back to Juthoor dashboard</a>');
    return;
  }
  // Sanitize: only allow .md files within the site, no traversal
  if (file.includes('..') || !file.endsWith('.md')) {
    setState('Invalid document path.');
    return;
  }
  // If user preference is Arabic, prefer the -ar variant when available.
  const lang = getCurrentLang();
  if (lang === 'ar' && !file.endsWith('-ar.md')) {
    const arFile = arVariantOf(file);
    try {
      const head = await fetch(arFile, { method: 'HEAD' });
      if (head.ok) {
        // Update URL silently and continue with the AR file
        const newParams = new URLSearchParams(window.location.search);
        newParams.set('file', arFile);
        window.history.replaceState({}, '', window.location.pathname + '?' + newParams.toString());
        file = arFile;
      }
    } catch (_) { /* fall through to original */ }
  }
  crumbEl.textContent = file;
  rawLink.href = file;
  // Provisional title from filename — overwritten below once the H1 is parsed.
  document.title = file.split('/').pop().replace(/-ar\.md$|\.md$/, '') + ' · Juthoor';

  try {
    const resp = await fetch(file);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const md = await resp.text();
    // Pull the first H1 + first non-heading paragraph so the page has a real
    // title and the social-card preview shows something meaningful.
    const h1 = (md.match(/^# +(.+)$/m) || [])[1];
    if (h1) {
      const clean = h1.replace(/[`*_]/g, '').trim();
      document.title = clean + ' · Juthoor';
      const ogT = document.getElementById('og-title');
      const twT = document.getElementById('tw-title');
      if (ogT) ogT.setAttribute('content', clean + ' · Juthoor');
      if (twT) twT.setAttribute('content', clean + ' · Juthoor');
    }
    const firstPara = (md
      .replace(/^#.*$/gm, '')           // drop heading lines
      .replace(/^>.*$/gm, '')           // drop blockquotes
      .replace(/^---$/gm, '')           // drop separators
      .split(/\n\n+/)
      .map(s => s.trim())
      .find(s => s.length > 40)) || '';
    if (firstPara) {
      const desc = firstPara.replace(/\s+/g, ' ').slice(0, 200).replace(/[`*_]/g, '');
      const ogD = document.getElementById('og-desc');
      if (ogD) ogD.setAttribute('content', desc);
    }
    const isArabic = detectArabic(md);
    if (isArabic) {
      document.documentElement.setAttribute('dir', 'rtl');
      document.documentElement.setAttribute('lang', 'ar');
      docEl.classList.add('has-arabic');
    } else {
      document.documentElement.setAttribute('dir', 'ltr');
      document.documentElement.setAttribute('lang', 'en');
      docEl.classList.remove('has-arabic');
    }
    marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });
    const rawHtml = marked.parse(md);
    const cleaned = DOMPurify.sanitize(rawHtml, { ADD_ATTR: ['target', 'rel'] });
    const rewritten = rewriteLinks(cleaned, file);
    docEl.innerHTML = rewritten + '<div class="doc-foot"><a href="index.html">← Back to dashboard</a><span>' + file + '</span></div>';
    // Open external links in new tab
    docEl.querySelectorAll('a[href^="http"]').forEach(a => {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
    });
  } catch (err) {
    setState('Could not load <code>' + file + '</code><br><small>' + err.message + '</small><br><br><a href="index.html">← Back to Juthoor dashboard</a>');
  }
}

loadDocument();
</script>
</body>
</html>
